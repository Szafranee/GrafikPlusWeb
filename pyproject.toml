[project]
name = "grafikplusweb"
version = "0.1.0"
description = "Web application for downloading and converting Canal+ work schedules to Excel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4",
    "flask",
    "flask-cors",
    "gunicorn",
    "lxml>=6.1.2",
    "openpyxl",
    "python-dotenv",
    "requests",
]

[tool.uv]
package = false
