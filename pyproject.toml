[project]
name = "grafikplusweb"
version = "0.1.0"
description = "Web application for downloading and converting Canal+ work schedules to Excel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4",
    "flask",
    "flask-cors",
    "gunicorn",
    "lxml>=6.1.2",
    "openpyxl",
    "python-dotenv",
    "requests",
    "tzdata>=2025.2",
]

[tool.uv]
package = false
